[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:mongod]
command=/usr/bin/mongod --dbpath %(ENV_OPENHOST_APP_DATA_DIR)s/mongo --bind_ip 127.0.0.1 --port 27017 --quiet
priority=10
autostart=true
autorestart=unexpected
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --dir %(ENV_OPENHOST_APP_DATA_DIR)s/redis --appendonly yes --save 60 1000
priority=10
autostart=true
autorestart=unexpected
startsecs=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
priority=10
autostart=true
autorestart=unexpected
startsecs=10
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server %(ENV_OPENHOST_APP_ARCHIVE_DIR)s/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
priority=10
autostart=true
autorestart=unexpected
startsecs=5
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:revolt-api]
command=/bin/sh -ec 'until mongosh --quiet --host 127.0.0.1 --eval "quit(db.runCommand({ping:1}).ok ? 0 : 1)"; do sleep 1; done; until redis-cli -h 127.0.0.1 ping | grep -q PONG; do sleep 1; done; until nc -z 127.0.0.1 5672; do sleep 1; done; exec /opt/stoat/bin/revolt-delta'
directory=/opt/stoat
environment=ROCKET_ADDRESS="127.0.0.1",ROCKET_PORT="14702"
priority=30
autostart=true
autorestart=unexpected
startsecs=5
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:revolt-events]
command=/bin/sh -ec 'until redis-cli -h 127.0.0.1 ping | grep -q PONG; do sleep 1; done; exec /opt/stoat/bin/revolt-bonfire'
directory=/opt/stoat
priority=30
autostart=true
autorestart=unexpected
startsecs=5
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:revolt-autumn]
command=/bin/sh -ec 'until curl -fsS http://127.0.0.1:9000/minio/health/ready; do sleep 1; done; mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; mc mb --ignore-existing local/revolt-uploads; exec /opt/stoat/bin/revolt-autumn'
directory=/opt/stoat
priority=30
autostart=true
autorestart=unexpected
startsecs=5
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:owner-auth]
command=/bin/sh -ec 'until curl -fsS http://127.0.0.1:14702/ >/dev/null; do sleep 1; done; exec /usr/bin/python3 /opt/stoat/owner_auth.py'
priority=40
autostart=true
autorestart=unexpected
startsecs=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/bin/sh -ec 'until curl -fsS http://127.0.0.1:14702/ >/dev/null; do sleep 1; done; exec /usr/sbin/nginx -g "daemon off;"'
priority=50
autostart=true
autorestart=unexpected
startsecs=5
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
