worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=owner_session:10m rate=10r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8000;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

        location = /_healthz {
            access_log off;
            proxy_pass http://127.0.0.1:14702/;
        }

        location = /.well-known/stoat {
            default_type application/json;
            alias /run/stoat/stoat.json;
        }

        # OpenHost removes client-supplied copies of this header and adds it
        # only after authenticating the zone owner. Never expose the session
        # bootstrap to ordinary Stoat users or public visitors.
        location = /openhost/owner-session {
            if ($http_x_openhost_is_owner != "true") { return 403; }
            access_log off;
            limit_req zone=owner_session burst=3 nodelay;
            proxy_pass http://127.0.0.1:14706/session;
            proxy_set_header X-OpenHost-Is-Owner $http_x_openhost_is_owner;
            proxy_hide_header Server;
            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'" always;
        }

        # These files are modified for each OpenHost hostname at container
        # startup. They must be revalidated instead of surviving an upgrade in
        # a browser or shared proxy cache under the upstream asset hash.
        location = /index.html {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        }

        location = /openhost-sso.js {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        }

        location ~ ^/assets/index-[A-Za-z0-9_-]+\.js$ {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
            try_files $uri =404;
        }

        # GET /api/ is the client's bootstrap config: it carries the websocket
        # URL the app feeds straight into `new URL(...)`. Served without a
        # Cache-Control header, browsers cache it heuristically, so a config
        # captured before the OpenHost hostname was applied keeps being replayed
        # and `new URL("")` throws inside EventClient.connect. The app then dies
        # mid-boot leaving an empty #root - a grey page that only a cache-
        # bypassing reload fixes. Never let this response be cached.
        # add_header here replaces the server-level set, so restate those too.
        location /api/ {
            proxy_pass http://127.0.0.1:14702/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        }

        # Disable the PWA service worker. The upstream build ships
        # serviceWorker.js with a Workbox precache manifest baked in listing
        # bundle hashes from *its* build (index-BXPU1_yz.js and friends), which
        # do not match what this deployment serves. Worse, entrypoint.sh
        # rewrites the __VITE_*__ placeholders inside assets/index-*.js in place
        # at container start, so anything the worker precached earlier is served
        # back with the placeholders unsubstituted: the client then calls
        # new URL("__VITE_API_URL__/?") and dies before rendering, leaving a
        # grey page that only a worker-bypassing hard reload cleared. Serving a
        # 404 stops registration and lets browsers retire installed copies.
        # Costs offline/PWA support, which a self-hosted chat app does not need
        # nearly as much as it needs to load at all.
        location = /serviceWorker.js {
            return 404;
        }

        location = /sw.js {
            return 404;
        }

        location = /manifest.webmanifest {
            default_type application/manifest+json;
        }

        location = /api {
            return 308 /api/;
        }

        # Stoat's January service generates link metadata and proxies remote
        # preview media. Keep its public prefix aligned with Revolt.toml.
        location /january/ {
            proxy_pass http://127.0.0.1:14705/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /january {
            return 308 /january/;
        }

        location /ws {
            proxy_pass http://127.0.0.1:14703;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Must stay above the attachment ceiling in Revolt.toml, or nginx
        # rejects the upload with 413 before Autumn ever sees it and the raised
        # limit looks broken for no visible reason.
        location /autumn/ {
            client_max_body_size 200m;
            proxy_pass http://127.0.0.1:14704/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
