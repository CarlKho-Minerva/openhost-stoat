worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8000;
        server_name _;
        root /usr/share/nginx/html;

        location = /_healthz {
            access_log off;
            proxy_pass http://127.0.0.1:14702/;
        }

        location = /.well-known/stoat {
            default_type application/json;
            alias /run/stoat/stoat.json;
        }

        # OpenHost removes client-supplied copies of this header and adds it
        # only after authenticating the zone owner. Never expose the session
        # bootstrap to ordinary Stoat users or public visitors.
        location = /openhost/owner-session {
            if ($http_x_openhost_is_owner != "true") { return 403; }
            proxy_pass http://127.0.0.1:14705/session;
            proxy_set_header X-OpenHost-Is-Owner $http_x_openhost_is_owner;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:14702/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /api {
            return 308 /api/;
        }

        location /ws {
            proxy_pass http://127.0.0.1:14703;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        location /autumn/ {
            client_max_body_size 25m;
            proxy_pass http://127.0.0.1:14704/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
